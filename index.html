<title>Brothers Services</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="app-css">
/* Layout: left-aligned storefront. Header, hero with a three-step order strip, filter row, product grid, payment footer. Owner-only dock at the bottom for admin. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --fg:#0F1A33; --muted:#56627F; --line:#DCE1EE;
  --accent:#2B3FD6; --accent-ink:#FFFFFF; --accent-soft:#E7EAFB;
  --wa:#0F8A47; --wa-ink:#FFFFFF; --danger:#B42318; --warn:#9A5B00; --overlay:rgba(11,16,32,.55);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#131A2E; --fg:#E7EBF6; --muted:#9AA6C4; --line:#252E48;
    --accent:#8794FF; --accent-ink:#0B1020; --accent-soft:#1B2347;
    --wa:#2BD36B; --wa-ink:#06210F; --danger:#FF8A80; --warn:#F2B35B; --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131A2E; --fg:#E7EBF6; --muted:#9AA6C4; --line:#252E48;
  --accent:#8794FF; --accent-ink:#0B1020; --accent-soft:#1B2347;
  --wa:#2BD36B; --wa-ink:#06210F; --danger:#FF8A80; --warn:#F2B35B; --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:16px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body.modal-open{overflow:hidden}
#app{max-width:1120px;margin:0 auto;padding-block:20px 40px;min-width:0}
body.has-bar #app{padding-bottom:110px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.label{font:600 .72rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand .m1{fill:var(--accent)} .brand .m2{fill:var(--fg);opacity:.9}
.brand span{font:700 1.2rem var(--font-display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 40px;align-items:end;padding:12px 0 28px}
.hero h1{font:700 clamp(2rem,5.4vw,3.2rem)/1.04 var(--font-display);letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}
.hero p{margin:0 0 18px;color:var(--muted);max-width:52ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.steps .n{font:500 .95rem var(--font-mono);color:var(--accent);padding-top:1px}
.steps b{display:block;font-weight:600}
.steps small{color:var(--muted);font-size:.86rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;color:var(--fg);transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger)}
.btn-sm{min-height:36px;padding:0 12px;font-size:.88rem}
.btn-block{width:100%}

/* filters */
.shop-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:14px}
.search{flex:1 1 220px;max-width:360px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;max-width:100%}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.count{color:var(--muted);font-size:.88rem;padding:6px 0 12px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.card{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thumb{position:relative;aspect-ratio:1/1;background:var(--accent-soft);border:0;padding:0;cursor:pointer;display:block;width:100%}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;color:#fff;font:700 2.4rem var(--font-display);background:linear-gradient(135deg,hsl(var(--h) 58% 46%),hsl(calc(var(--h) + 40) 60% 32%))}
.tags{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 .68rem var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.tag-ex{color:var(--warn)} .tag-out{color:var(--danger)}
.body{display:flex;flex-direction:column;gap:8px;padding:14px;flex:1;min-width:0}
.cat{font:600 .7rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.name{font:700 1.12rem/1.25 var(--font-display);margin:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:.9rem;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:auto;padding-top:4px}
.price .now{font:500 1.25rem var(--font-mono)}
.price s{font:500 .9rem var(--font-mono);color:var(--muted)}
.price .off{font:600 .72rem var(--font-body);color:var(--wa);letter-spacing:.04em}
.tools{display:flex;gap:8px}
.tools .btn{flex:1}
.add-card{min-height:220px;border:2px dashed var(--line);border-radius:14px;background:transparent;cursor:pointer;display:grid;place-content:center;gap:6px;color:var(--muted);font-weight:600}
.add-card:hover{border-color:var(--accent);color:var(--accent)}
.add-card span{font:500 2rem/1 var(--font-mono);text-align:center}
.empty{grid-column:1/-1;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* footer */
.foot{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:20px}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
.pays{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.pay{flex:1 1 220px;min-width:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pay-h{font-weight:600} .pay-n{color:var(--muted);font-size:.9rem}
.pay-num{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.pay-num .mono{font-size:1.02rem;overflow-wrap:anywhere}
.fine{color:var(--muted);font-size:.86rem;margin:0}

/* admin */
.ainfo{margin-bottom:16px;padding:12px 14px;border:1px solid var(--line);border-left-width:1px;border-radius:12px;background:var(--surface);font-size:.92rem;display:grid;gap:4px}
.ainfo b{font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.dock-s{min-width:0;font-size:.9rem}
.dock-s b{display:block}
.dock-s span{color:var(--muted)}
.dock-b{display:flex;flex-wrap:wrap;gap:8px}

/* modal */
.ov{position:fixed;inset:0;z-index:40;background:var(--overlay);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.sheet h2{font:700 1.3rem var(--font-display);margin:0;letter-spacing:-.01em}
.sheet-img{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--accent-soft)}
.sheet-img img{width:100%;height:100%;object-fit:contain;display:block}
.sheet .full{white-space:pre-line;color:var(--muted);margin:0;overflow-wrap:anywhere}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.field{display:grid;gap:6px;min-width:0}
.field>span{font:600 .72rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=tel],.field textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.field textarea{resize:vertical;min-height:96px}
.field small{color:var(--muted);font-size:.8rem}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.imgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgprev{width:96px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--accent-soft);border:1px solid var(--line);flex:none}
.imgprev img{width:100%;height:100%;object-fit:cover;display:block}
.imgctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 180px;min-width:0}
.filein{flex:1 1 180px;min-width:0;max-width:100%;font-size:.9rem}
.filein::file-selector-button{min-height:36px;padding:0 12px;margin-right:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer}
.ferr{color:var(--danger);font-size:.9rem;min-height:1.2em;margin:0}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
body.has-bar .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}

@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr);align-items:start}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

}
function waNumber(){
  var d=String(S().whatsapp||'').replace(/\D/g,'');

}
function waLink(p){
  var n=waNumber(); if(!n) return '';

  return 'https://wa.me/'+n+'?text='+encodeURIComponent(t);
}
function waGeneral(){

}

  var ini=String(name||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join('').toUpperCase();
  return '<div class="ph" style="--h:'+hue(name)+'"><span>'+esc(ini)+'</span></div>';
}
function imgOrPh(p){

/* ---------- rendering ---------- */
function skeleton(){
  $('#app').innerHTML='<header id="hdr" class="hdr"></header><div id="ainfo"></div><section id="hero" class="hero"></section><section id="shop"><div class="shop-top"><input id="q" class="search" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off"><div id="chips" class="chips"></div></div><div id="count" class="count"></div><div id="grid" class="grid"></div></section><footer id="foot" class="foot"></footer><div id="bar"></div><div id="modal"></div><div id="toast"></div>';
}
function renderHeader(){
  var admin=ui.owner?'<button class="btn btn-ghost btn-sm" data-act="admin-toggle">'+(ui.admin?'Customer view':'Admin')+'</button>':'';
  $('#hdr').innerHTML='<div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect class="m1" x="2" y="7" width="19" height="19" rx="6"/><rect class="m2" x="13" y="9" width="19" height="19" rx="6"/></svg><span>'+esc(S().storeName)+'</span></div>'+admin;
}
function renderAdminInfo(){
  var el=$('#ainfo');
  if(!(ui.owner&&ui.admin)){el.innerHTML='';return}
  var lines=['<b>Admin mode</b>'];
  lines.push('Changes stay in this draft until you press Publish changes. Customers see nothing new before that.');
  if(ui.data.products.some(function(p){return p.sample})) lines.push('Products marked Example are hidden from customers. Edit or delete them.');
  if(!waNumber()) lines.push('Your WhatsApp number is not set, so the Order buttons are switched off. Open Settings to add it.');
  el.innerHTML='<div class="ainfo">'+lines.map(function(l,i){return i?'<span>'+l+'</span>':l}).join('')+'</div>';
}
function renderHero(){
  var s=S(), wa=waGeneral();
  $('#hero').innerHTML='<div><h1>'+esc(s.headline)+'</h1><p>'+esc(s.tagline)+'</p>'+(wa?'<a class="btn btn-wa" href="'+esc(wa)+'" target="_blank" rel="noopener">Chat on WhatsApp</a>':'')+'</div><ol class="steps"><li><span class="n">1</span><div><b>Choose a product</b><small>Browse the list and tap Order.</small></div></li><li><span class="n">2</span><div><b>Message us on WhatsApp</b><small>Your order message is already written.</small></div></li><li><span class="n">3</span><div><b>Pay and get your access</b><small>JazzCash or EasyPaisa. Details come on WhatsApp.</small></div></li></ol>';
}
function renderChips(){
  var cats=[];
  products().forEach(function(p){var c=(p.category||'').trim();if(c&&cats.indexOf(c)<0) cats.push(c)});
  if(ui.cat!=='All'&&cats.indexOf(ui.cat)<0) ui.cat='All';
  var el=$('#chips');
  if(!cats.length){el.innerHTML='';return}
  el.innerHTML=['All'].concat(cats).map(function(c){return '<button class="chip" data-act="cat" data-cat="'+esc(c)+'" aria-pressed="'+(ui.cat===c)+'">'+esc(c)+'</button>'}).join('');
}
function orderBtn(p){
  if(!p.inStock) return '<button class="btn btn-block" disabled>Out of stock</button>';
  var l=waLink(p);
  if(!l) return '<button class="btn btn-wa btn-block" disabled>Order on WhatsApp</button>';
  return '<a class="btn btn-wa btn-block" href="'+esc(l)+'" target="_blank" rel="noopener">Order on WhatsApp</a>';
}
function priceHTML(p){
  if(!hasNum(p.price)) return '<div class="price"><span class="now">Ask for price</span></div>';
  var off='';
  if(hasNum(p.oldPrice)&&Number(p.oldPrice)>Number(p.price)) off='<s>'+esc(money(p.oldPrice))+'</s><span class="off">-'+Math.round((1-Number(p.price)/Number(p.oldPrice))*100)+'%</span>';
  return '<div class="price"><span class="now">'+esc(money(p.price))+'</span>'+off+'</div>';
}
function cardHTML(p){
  var tags='';
  if(p.sample) tags+='<span class="tag tag-ex">Example</span>';
  if(!p.inStock) tags+='<span class="tag tag-out">Out of stock</span>';
  var tools=ui.admin?'<div class="tools"><button class="btn btn-sm" data-act="edit" data-id="'+esc(p.id)+'">Edit</button><button class="btn btn-sm btn-danger" data-act="del" data-id="'+esc(p.id)+'">Delete</button></div>':'';
  return '<article class="card"><button class="thumb" data-act="open" data-id="'+esc(p.id)+'" aria-label="View '+esc(p.name)+'">'+imgOrPh(p)+(tags?'<div class="tags">'+tags+'</div>':'')+'</button><div class="body">'+(p.category?'<div class="cat">'+esc(p.category)+'</div>':'')+'<button class="name" data-act="open" data-id="'+esc(p.id)+'">'+esc(p.name)+'</button>'+(p.desc?'<p class="desc">'+esc(p.desc)+'</p>':'')+priceHTML(p)+orderBtn(p)+tools+'</div></article>';
}
function renderGrid(){
  var q=ui.q.trim().toLowerCase();
  var all=products();
  var shown=all.filter(function(p){
    if(ui.cat!=='All'&&(p.category||'').trim()!==ui.cat) return false;
    if(!q) return true;
    return (p.name+' '+(p.category||'')+' '+(p.desc||'')).toLowerCase().indexOf(q)>=0;
  });
  var html='';
  if(ui.admin) html+='<button class="add-card" data-act="add"><span>+</span>Add product</button>';
  html+=shown.map(cardHTML).join('');
  if(!shown.length){
    var msg=all.length?'No products match your search.':(ui.admin?'No products yet. Add your first one.':'Products are being added. Check back soon, or message us on WhatsApp.');
    html+='<div class="empty">'+esc(msg)+'</div>';
  }
  $('#grid').innerHTML=html;
  $('#count').textContent=all.length?(shown.length+(shown.length===1?' product':' products')):'';
}
function payBlock(label,name,num){
  if(!num) return '';
  return '<div class="pay"><div class="pay-h">'+label+'</div>'+(name?'<div class="pay-n">'+esc(name)+'</div>':'')+'<div class="pay-num"><span class="mono">'+esc(num)+'</span><button class="btn btn-ghost btn-sm" data-act="copy" data-text="'+esc(num)+'">Copy</button></div></div>';
}
function renderFooter(){
  var s=S();
  var pays=payBlock('JazzCash',s.jazzName,s.jazzNumber)+payBlock('EasyPaisa',s.easyName,s.easyNumber);
  var n=waNumber(), wa=waGeneral();
  $('#foot').innerHTML='<div class="foot-grid"><div><div class="label">Payment</div>'+(pays?'<div class="pays">'+pays+'</div>':'<p class="fine" style="margin-top:8px">Payment details are shared on WhatsApp when you order.</p>')+'</div><div><div class="label">WhatsApp</div>'+(n?'<p class="mono" style="margin:8px 0 10px">+'+esc(n)+'</p><a class="btn btn-wa btn-sm" href="'+esc(wa)+'" target="_blank" rel="noopener">Message us</a>':'<p class="fine" style="margin-top:8px">Number coming soon.</p>')+'</div></div>'+(s.note?'<p class="fine">'+esc(s.note)+'</p>':'')+'<p class="fine">&copy; '+new Date().getFullYear()+' '+esc(s.storeName)+'</p>';
}
function renderBar(){
  var el=$('#bar');
  if(!(ui.owner&&ui.admin)){el.innerHTML='';document.body.classList.remove('has-bar');return}
  document.body.classList.add('has-bar');
  el.innerHTML='<div class="dock"><div class="dock-in"><div class="dock-s"><b>Admin mode</b><span>'+(ui.busy?'Publishing...':(ui.dirty?'You have unpublished changes':'Everything is published'))+'</span></div><div class="dock-b"><button class="btn btn-sm" data-act="settings">Settings</button>'+(ui.dirty?'<button class="btn btn-sm" data-act="discard">Discard</button>':'')+'<button class="btn btn-primary btn-sm" data-act="publish"'+((!ui.dirty||ui.busy)?' disabled':'')+'>Publish changes</button></div></div></div>';
}
function renderAll(){renderHeader();renderAdminInfo();renderHero();renderChips();renderGrid();renderFooter();renderBar()}
function markDirty(){ui.dirty=true}
function toast(msg){
  var el=$('#toast'); el.className='toast'; el.textContent=msg;
  clearTimeout(toast.t); toast.t=setTimeout(function(){el.className='';el.textContent=''},3200);
}

/* ---------- modals ---------- */
function field(id,label,val,type,hint){
  return '<label class="field"><span>'+label+'</span><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'" autocomplete="off">'+(hint?'<small>'+hint+'</small>':'')+'</label>';
}
function productForm(){
  var i=ui.modal.id?find(ui.modal.id):-1, p=i>=0?ui.data.products[i]:{name:'',category:'',price:'',oldPrice:'',desc:'',inStock:true};
  var cats=[];ui.data.products.forEach(function(x){var c=(x.category||'').trim();if(c&&cats.indexOf(c)<0) cats.push(c)});
  return '<form id="pform" class="sheet" novalidate><h2>'+(i>=0?'Edit product':'Add product')+'</h2>'
  +field('f-name','Name',p.name,'text')
  +'<label class="field"><span>Category</span><input id="f-cat" type="text" list="cats" value="'+esc(p.category)+'" autocomplete="off"><datalist id="cats">'+cats.map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></label>'
  +'<div class="row"><label class="field"><span>Price ('+esc(S().currency)+')</span><input id="f-price" type="number" inputmode="decimal" min="0" step="any" value="'+esc(p.price)+'"></label><label class="field"><span>Old price (optional)</span><input id="f-old" type="number" inputmode="decimal" min="0" step="any" value="'+esc(p.oldPrice)+'"></label></div>'
  +'<label class="field"><span>Description</span><textarea id="f-desc" rows="4">'+esc(p.desc)+'</textarea></label>'
  +'<div class="field"><span>Picture</span><div class="imgbox"><div class="imgprev" id="f-prev">'+(ui.modal.image?'<img src="'+esc(ui.modal.image)+'" alt="">':ph(p.name||'?'))+'</div><div class="imgctl"><input id="f-file" class="filein" type="file" accept="image/*"><button type="button" class="btn btn-sm btn-ghost" data-act="rmimg">Remove picture</button></div></div><small>Pictures are shrunk automatically. Use few, small pictures to keep the page fast.</small><small id="f-status"></small></div>'
  +'<label class="check"><input id="f-stock" type="checkbox"'+(p.inStock?' checked':'')+'><span>In stock</span></label>'
  +'<p class="ferr" id="ferr"></p><div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save product</button></div></form>';
}
function settingsForm(){
  var s=S();
  return '<form id="sform" class="sheet" novalidate><h2>Store settings</h2>'
  +field('s-name','Store name',s.storeName)
  +field('s-head','Headline',s.headline)
  +field('s-tag','Short description',s.tagline)
  +field('s-wa','WhatsApp number',s.whatsapp,'tel','Include the country code, for example 923001234567. A number starting with 0 is treated as Pakistani.')
  +field('s-cur','Currency label',s.currency)
  +'<div class="row">'+field('s-jn','JazzCash account name',s.jazzName)+field('s-jx','JazzCash number',s.jazzNumber,'tel')+'</div>'
  +'<div class="row">'+field('s-en','EasyPaisa account name',s.easyName)+field('s-ex','EasyPaisa number',s.easyNumber,'tel')+'</div>'
  +field('s-note','Footer note',s.note)
  +'<p class="ferr" id="ferr"></p><div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save settings</button></div></form>';
}
function detailHTML(p){
  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(p.name)+'"><div class="sheet-img">'+imgOrPh(p)+'</div><div>'+(p.category?'<div class="cat">'+esc(p.category)+'</div>':'')+'<h2>'+esc(p.name)+'</h2></div>'+priceHTML(p)+(p.desc?'<p class="full">'+esc(p.desc)+'</p>':'')+orderBtn(p)+'<div class="actions"><button class="btn" data-act="close">Close</button></div></div>';
}
function confirmHTML(title,text,act,label){
  return '<div class="sheet" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2><p class="full">'+esc(text)+'</p><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn btn-primary" data-act="'+act+'">'+esc(label)+'</button></div></div>';
}
function renderModal(){
  var m=ui.modal, el=$('#modal');
  if(!m){el.innerHTML='';document.body.classList.remove('modal-open');return}
  var inner='';
  if(m.kind==='product') inner=productForm();
  else if(m.kind==='settings') inner=settingsForm();
  else if(m.kind==='detail'){var i=find(m.id);if(i<0){closeModal();return}inner=detailHTML(ui.data.products[i])}
  else if(m.kind==='delete'){var j=find(m.id);if(j<0){closeModal();return}inner=confirmHTML('Delete this product?','"'+ui.data.products[j].name+'" will be removed from your draft. It disappears from the live store when you publish.','do-delete','Delete')}
  else if(m.kind==='discard') inner=confirmHTML('Discard changes?','Everything you changed since the last publish will be lost.','do-discard','Discard');
  el.innerHTML='<div class="ov" data-act="overlay">'+inner+'</div>';
  document.body.classList.add('modal-open');
  var first=el.querySelector('input[type=text],input[type=tel]');
  if(first&&m.kind==='product'&&!m.id){try{first.focus()}catch(e){}}
}
function openModal(m){ui.modal=m;renderModal()}
function closeModal(){ui.modal=null;renderModal()}

/* ---------- actions ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('decode'))};
      im.onload=function(){
        var max=900,s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function ferr(msg){var e=$('#ferr');if(e) e.textContent=msg}
function setStatus(msg){var e=$('#f-status');if(e) e.textContent=msg}
function saveProduct(){
  if(ui.imgBusy){ferr('The picture is still being added. Wait a moment and press Save again.');return}
  var name=$('#f-name').value.trim();
  if(!name){ferr('Enter a product name.');return}
  var pr=$('#f-price').value.trim(), op=$('#f-old').value.trim();
  if((pr!==''&&(isNaN(Number(pr))||Number(pr)<0))||(op!==''&&(isNaN(Number(op))||Number(op)<0))){ferr('Prices must be numbers, zero or more.');return}
  var rec={id:ui.modal.id||uid(),name:name,category:$('#f-cat').value.trim(),price:pr===''?'':Number(pr),oldPrice:op===''?'':Number(op),desc:$('#f-desc').value.trim(),image:ui.modal.image||'',inStock:$('#f-stock').checked,sample:false};
  var i=ui.modal.id?find(ui.modal.id):-1;
  if(i>=0) ui.data.products[i]=rec; else ui.data.products.unshift(rec);
  markDirty();closeModal();renderChips();renderGrid();renderAdminInfo();renderBar();
}
function saveSettings(){
  var name=$('#s-name').value.trim();
  if(!name){ferr('Enter a store name.');return}
  var s=S();
  s.storeName=name;s.headline=$('#s-head').value.trim();s.tagline=$('#s-tag').value.trim();s.whatsapp=$('#s-wa').value.trim();
  s.currency=$('#s-cur').value.trim();s.jazzName=$('#s-jn').value.trim();s.jazzNumber=$('#s-jx').value.trim();
  s.easyName=$('#s-en').value.trim();s.easyNumber=$('#s-ex').value.trim();s.note=$('#s-note').value.trim();
  markDirty();closeModal();renderAll();
}
function buildDoc(d){
  var json=JSON.stringify(d).replace(/</g,'\\u003c');
  var css=document.getElementById('app-css').textContent;
  var js=document.getElementById('app-js').textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +'<title>'+esc(d.settings.storeName||'Brothers Services')+'</title><meta name="claude:viewport-fit-sides" content="cover">'+FONT_LINK
    +'<style id="app-css">'+css+'</style><div id="app"></div><script type="application/json" id="store-data">'+json+CLOSE_SCRIPT
    +'<script id="app-js">'+js+CLOSE_SCRIPT+'</body></html>';
}
function publish(){
  if(ui.busy||!ui.dirty) return;
  if(!ui.art){toast('Saving is not available in this view.');return}
  ui.busy=true;renderBar();
  ui.art.publish(buildDoc(ui.data)).then(function(){
    toast('Published');
  },function(e){
    ui.busy=false;renderBar();
    var c=e&&e.code;
    if(c==='conflict') toast('A newer version was saved first. The page is reloading.');
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed') toast('This view is read-only, so changes cannot be published.');
    else if(c==='too_large') toast('The page is too large. Remove some pictures or use smaller ones.');
    else if(c==='rate_limited') toast('Publishing too fast. Wait a moment and try again.');
    else toast('Could not publish. Try again.');
  });
}
function copyText(t){
  var fail=function(){toast('Press and hold the number to copy it.')};
  try{navigator.clipboard.writeText(t).then(function(){toast('Copied')},fail)}catch(e){fail()}
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act'), id=t.getAttribute('data-id');
  if(act==='overlay'){if(e.target===t&&ui.modal&&(ui.modal.kind==='detail'||ui.modal.kind==='delete'||ui.modal.kind==='discard')) closeModal();return}
  if(act==='open') openModal({kind:'detail',id:id});
  else if(act==='close') closeModal();
  else if(act==='cat'){ui.cat=t.getAttribute('data-cat');renderChips();renderGrid()}
  else if(act==='admin-toggle'){ui.admin=!ui.admin;renderAll()}
  else if(act==='add') openModal({kind:'product',id:'',image:''});
  else if(act==='edit'){var i=find(id);if(i>=0) openModal({kind:'product',id:id,image:ui.data.products[i].image||''})}
  else if(act==='del') openModal({kind:'delete',id:id});
  else if(act==='do-delete'){var k=find(ui.modal.id);if(k>=0){ui.data.products.splice(k,1);markDirty()}closeModal();renderChips();renderGrid();renderAdminInfo();renderBar()}
  else if(act==='settings') openModal({kind:'settings'});
  else if(act==='discard') openModal({kind:'discard'});
  else if(act==='do-discard'){ui.data=clone(saved);ui.dirty=false;closeModal();renderAll()}
  else if(act==='publish') publish();
  else if(act==='rmimg'){ui.modal.image='';var pv=$('#f-prev');if(pv) pv.innerHTML=ph($('#f-name').value||'?')}
  else if(act==='copy') copyText(t.getAttribute('data-text'));
});
document.addEventListener('submit',function(e){
  if(e.target.id==='pform'){e.preventDefault();saveProduct()}
  else if(e.target.id==='sform'){e.preventDefault();saveSettings()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;renderGrid()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='f-file'&&e.target.files&&e.target.files[0]){
    ferr('');setStatus('Adding picture...');ui.imgBusy=true;
    shrink(e.target.files[0]).then(function(url){
      ui.imgBusy=false;
      if(!ui.modal||ui.modal.kind!=='product') return;
      ui.modal.image=url;var pv=$('#f-prev');if(pv) pv.innerHTML='<img src="'+esc(url)+'" alt="">';
      setStatus('Picture added. Press Save product.');
    },function(){ui.imgBusy=false;setStatus('');ferr('That picture could not be read. Try a JPG or PNG.')});
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal) closeModal()});

/* ---------- start ---------- */
skeleton();renderAll();
(function(){
  if(!(window.claude&&window.claude.use)) return;
  window.claude.use('user').then(function(user){
    if(!user) return;
    return user.isOwner().then(function(o){if(o){ui.owner=true;renderHeader()}});
  }).catch(function(){});
  window.claude.use('artifact').then(function(a){ui.art=a||null}).catch(function(){});
})();
})();
</script>
